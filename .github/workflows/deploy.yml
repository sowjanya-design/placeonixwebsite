name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, vps]
    steps:
      - name: Deploy
        run: |
          set -e
          cd /home/apps/placeonix-website
          git fetch origin main
          git reset --hard origin/main
          cd web-next
          source /root/.nvm/nvm.sh
          npm ci
          npm run build
          pm2 restart placeonix-website
